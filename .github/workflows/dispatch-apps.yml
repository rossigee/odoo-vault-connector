name: Dispatch App Rebuilds

on:
  push:
    branches:
      - 16.0-develop
  release:
    types: [published]

jobs:
  dispatch:
    name: Dispatch to consuming apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - odoo-bksc
          - odoo-pksc
          - odoo-rossgolderltd
          - odoo-family
          - bankrutrocks
    steps:
    - name: Determine dispatch type and payload
      id: vars
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          echo "event_type=module-release" >> $GITHUB_OUTPUT
          echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "event_type=module-staging-update" >> $GITHUB_OUTPUT
          echo "version=16.0-develop" >> $GITHUB_OUTPUT
        fi

    - name: Send repository dispatch
      run: |
        curl -sSL -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/rossigee/${{ matrix.repo }}/dispatches \
          -d '{
            "event_type": "${{ steps.vars.outputs.event_type }}",
            "client_payload": {
              "module": "odoo-vault-connector",
              "version": "${{ steps.vars.outputs.version }}"
            }
          }'

    - name: Notify
      if: failure()
      run: echo "Failed to dispatch to ${{ matrix.repo }}"
